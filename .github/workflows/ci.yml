name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amax
          POSTGRES_PASSWORD: amax
          POSTGRES_DB: amax
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_MIGRATE_URL: postgres://amax:amax@localhost:5432/amax
      # 029 AC-3: the workflow suite also runs on a local Temporal dev server.
      AMAX_TEMPORAL_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: App role for row-level security tests
        run: psql "$DATABASE_MIGRATE_URL" -c "create role amax_app login password 'amax_app'"
      - run: pnpm db:migrate
      - run: pnpm lint
      # 061: one Postgres serves every package's tests; more packages at once than the runner has cores
      # starves them past their setup timeouts.
      - run: pnpm turbo run test --concurrency=2
      - run: node scripts/check-module-standard.mjs
      - run: pnpm build
      - run: pnpm --filter @amax/web exec playwright install --with-deps chromium
      - run: pnpm --filter @amax/web e2e
      - run: pnpm --filter @amax/web e2e:auth
      # A failed e2e leaves its page snapshot and trace: print the snapshot here, keep the rest as an artifact.
      - name: Playwright failure context
        if: failure()
        run: find apps/web/test-results -name error-context.md -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7

  # 074: a fork PR must carry a finished specclaw-review loop; same-repo PRs only at module end.
  review-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review evidence for touched specclaw changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: node scripts/check-review-gate.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --fork "$FORK"

  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: |
          mkdir -p .vercel
          echo '{"projectId":"ci","orgId":"ci","settings":{"framework":"nextjs","rootDirectory":"apps/web","nodeVersion":"22.x"}}' > .vercel/project.json
      - run: pnpm dlx vercel@64.5.0 build --yes

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @amax/web build:cloudflare
      - run: test -f apps/web/.open-next/worker.js

  docker-k3s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t amax:ci .
      - name: Image serves /healthz
        run: |
          docker run -d --name amax -p 3000:3000 amax:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && exit 0; sleep 1; done
          docker logs amax; exit 1
      # 063: public/ must ship in the image; signed-out visitors fetch these from the marketing page.
      - name: Image serves the marketing media
        run: |
          check() { got=$(curl -s -o /dev/null -w '%{http_code}' "$@"); [ "$got" = "$want" ] || { echo "expected $want, got $got: $*"; docker logs amax; exit 1; }; }
          want=200; for f in amax-product.mp4 amax-product.webm amax-product-poster.jpg amax-product.en.vtt amax-og.jpg; do check "localhost:3000/marketing/$f"; done
          want=206; check -H 'Range: bytes=0-1023' localhost:3000/marketing/amax-product.mp4
          type=$(curl -sI localhost:3000/marketing/amax-product.mp4 | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          [ "$type" = "video/mp4" ] || { echo "expected video/mp4, got '$type'"; docker logs amax; exit 1; }
      - run: helm lint deploy/helm/amax
      - name: Chart renders the worker Deployment
        run: helm template t deploy/helm/amax --set worker.enabled=true --set envFromSecret=amax | grep -q 'node", "apps/web/worker.mjs'
      - run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
      - run: k3d cluster create smoke --no-lb --wait
      - run: k3d image import amax:ci -c smoke
      - run: >-
          helm install smoke deploy/helm/amax --wait --timeout 180s
          --set image.repository=amax --set image.tag=ci --set image.pullPolicy=Never
      - name: Chart serves /healthz
        run: |
          kubectl port-forward svc/smoke 8080:80 &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && exit 0; sleep 1; done
          kubectl describe pods; kubectl logs deploy/smoke; exit 1
      # 034 AC-3: the weekly restore drill, run here on k3d exactly as the chart's CronJob runs it.
      - run: docker build --target ops -t amax:ci-ops .
      - run: k3d image import amax:ci-ops -c smoke
      - name: Restore drill on k3d
        run: deploy/ci/k3d-drill.sh
